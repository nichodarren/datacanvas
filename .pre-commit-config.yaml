# Git-level enforcement — berlaku untuk siapa pun yang menyentuh repo ini
# (manusia maupun agent), tidak terikat satu editor atau satu tool.
#
# Pasang sekali:  pre-commit install
#
# `default_install_hook_types` wajib ada: tanpa ini, `pre-commit install`
# hanya memasang stage `pre-commit` dan hook `commit-msg` diam-diam TIDAK
# terpasang — validator Conventional Commits jadi tidak pernah jalan.
default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3.13

# Skill pihak ketiga di `config/skills/` di-vendor **verbatim** (D-035), dan
# `config/skills/.upstream-commit-vercel` mencatat commit asalnya supaya
# pembaruan bisa ditinjau sebagai diff. Hook perapi whitespace menghancurkan
# justru kemampuan itu: ia menyunting berkasnya saat commit pertama, dan sejak
# itu setiap diff terhadap hulu berisi ratusan perubahan spasi yang bukan
# perubahan aturan. Ditemukan saat commit pertama, yang menyentuh 19 berkas.
#
# Yang dikecualikan hanya salinan verbatim. `README.md` dan `SKILL.md`
# web-design-guidelines kita tulis sendiri, jadi keduanya tetap dirapikan.
#
# Pola ini ditulis dua kali alih-alih dipakai lewat anchor YAML: anchor menuntut
# sebuah key di root, dan pre-commit mencetak `Unexpected key(s) present at
# root` setiap kali ia jalan. Peringatan yang muncul di tiap commit melatih
# orang mengabaikan peringatan — duplikasi satu regex lebih murah daripada itu.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\config/skills/(react-best-practices|composition-patterns)/|^\config/skills/web-design-guidelines/guidelines\.md$
      - id: end-of-file-fixer
        exclude: ^\config/skills/(react-best-practices|composition-patterns)/|^\config/skills/web-design-guidelines/guidelines\.md$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-case-conflict
      # Dataset eval sengaja besar & di-commit (golden_queries.md §3).
      - id: check-added-large-files
        args: ["--maxkb=20000"]
      # NFR-SEC.7 — rahasia tidak pernah masuk repo.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      # Berjalan di environment terisolasi milik pre-commit, BUKAN venv project.
      # Konsekuensinya: setiap dependensi yang tipenya perlu dikenali mypy harus
      # didaftarkan manual di bawah, dan daftar ini WAJIB disinkronkan setiap
      # kali dependensi ber-tipe ditambahkan ke pyproject.toml.
      #
      # Isolasi ini dipilih dengan sadar meski merepotkan: alternatifnya
      # (`language: system` memakai venv project) gagal dengan pesan
      # "Executable `mypy` not found" setiap kali commit dilakukan dari shell
      # yang venv-nya belum diaktifkan — dan itu sering, terutama lewat UI git
      # di IDE. Kegagalan yang membingungkan setiap hari lebih buruk daripada
      # satu baris yang perlu diingat saat menambah dependensi.
      - id: mypy
        args: [--strict]
        files: ^(backend|eval|tests|scripts)/
        additional_dependencies:
          - pydantic[email]
          - pydantic-settings
          - polars
          - duckdb
          - python-multipart
          - openpyxl
          - pytest
          - pytest-asyncio
          - sqlalchemy
          - alembic
          - fastapi
          - httpx
          - loguru
          - argon2-cffi
          - uvicorn

  - repo: local
    hooks:
      # Menegakkan konvensi commit (Conventional Commits) tanpa dependensi Node.
      - id: conventional-commit
        name: Pesan commit mengikuti Conventional Commits
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
