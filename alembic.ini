; Alembic configuration (D-021).
;
; The database URL is NOT here. env.py reads it from Settings, so DATABASE_URL
; has exactly one home (§13.8: secrets come from the environment only).

[alembic]
script_location = backend/migrations
prepend_sys_path = backend
path_separator = os

# Migration files sort by their revision prefix, so the filename says the order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
