# Postgres untuk pengembangan lokal (D-011).
# Alasan memilih Postgres alih-alih SQLite ada di DESIGN.md §10.3 — biaya setup
# lokal ini adalah trade-off yang diterima secara sadar, dan file ini adalah
# mitigasinya.
#
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: datacanvas-postgres
    environment:
      POSTGRES_USER: datacanvas
      POSTGRES_PASSWORD: datacanvas
      POSTGRES_DB: datacanvas
      # Urutan byte, deterministik dan identik di setiap mesin. Cluster lokal
      # portable (README) dan CI memakai yang sama — kalau ketiganya berbeda,
      # bug collation muncul hanya di satu tempat.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacanvas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
